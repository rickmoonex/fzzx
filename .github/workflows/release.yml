name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Release package
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show release result
        env:
          RELEASES_CREATED: ${{ steps.release-plz.outputs.releases_created }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "releases_created=$RELEASES_CREATED"
          echo "releases=$RELEASES"

  release-pr:
    name: Prepare release PR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  artifacts:
    name: ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and upload archive
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: fzzx
          target: ${{ matrix.target }}
          locked: true
          archive: fzzx-v${{ fromJSON(needs.release.outputs.releases)[0].version }}-${{ matrix.target }}
          include: README.md LICENSE CHANGELOG.md
          checksum: sha256
          ref: refs/tags/${{ fromJSON(needs.release.outputs.releases)[0].tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: [release, artifacts]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
          VERSION: ${{ fromJSON(needs.release.outputs.releases)[0].version }}
        run: |
          mkdir -p "$RUNNER_TEMP/fzzx-release"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/fzzx-release" \
            --pattern "fzzx-v${VERSION}-aarch64-apple-darwin.tar.gz" \
            --pattern "fzzx-v${VERSION}-x86_64-apple-darwin.tar.gz"

      - name: Update formula
        env:
          VERSION: ${{ fromJSON(needs.release.outputs.releases)[0].version }}
        run: |
          ARM_ARCHIVE="$RUNNER_TEMP/fzzx-release/fzzx-v${VERSION}-aarch64-apple-darwin.tar.gz"
          INTEL_ARCHIVE="$RUNNER_TEMP/fzzx-release/fzzx-v${VERSION}-x86_64-apple-darwin.tar.gz"
          ARM_SHA=$(shasum -a 256 "$ARM_ARCHIVE" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "$INTEL_ARCHIVE" | awk '{print $1}')
          scripts/update-homebrew-formula.sh "$VERSION" "$ARM_SHA" "$INTEL_SHA"

      - name: Commit formula
        env:
          VERSION: ${{ fromJSON(needs.release.outputs.releases)[0].version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fzzx.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(homebrew): update formula for v${VERSION}"
          git push origin HEAD:main
